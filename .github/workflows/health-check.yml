name: API Health Check

on:
  schedule:
    - cron: "0 */2 * * *" # every 2 hours
  workflow_dispatch: # allows manual trigger from GitHub UI

jobs:
  setup:
    name: Pick tweet ID
    runs-on: ubuntu-latest
    outputs:
      tweet_id: ${{ steps.pick.outputs.tweet_id }}
    steps:
      - name: Pick random tweet ID
        id: pick
        run: |
          IDS=(
            "2060317988603998459"
            "20"
            "1519480761749016577"
            "1897368229386383452"
          )
          TWEET_ID=${IDS[$RANDOM % ${#IDS[@]}]}
          echo "Selected tweet ID: $TWEET_ID"
          echo "tweet_id=$TWEET_ID" >> $GITHUB_OUTPUT

  check-methods:
    name: Check all methods
    runs-on: ubuntu-latest
    needs: setup
    env:
      TWEET_ID: ${{ needs.setup.outputs.tweet_id }}
    steps:
      - name: Check method -- rest-guest
        run: |
          echo "Checking rest-guest..."
          RESPONSE=$(curl -sf -w "\n%{http_code}" "https://freebird-api.com/status/$TWEET_ID/method/rest-guest")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP $HTTP_CODE | $BODY"
          [ "$HTTP_CODE" = "200" ] || { echo "FAILED: got $HTTP_CODE"; exit 1; }
          echo "$BODY" | grep -q '"error"' && { echo "FAILED: error in response"; exit 1; }
          echo "OK"

      - name: Check method -- rest-auth
        run: |
          echo "Checking rest-auth..."
          RESPONSE=$(curl -sf -w "\n%{http_code}" "https://freebird-api.com/status/$TWEET_ID/method/rest-auth")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP $HTTP_CODE | $BODY"
          [ "$HTTP_CODE" = "200" ] || { echo "FAILED: got $HTTP_CODE"; exit 1; }
          echo "$BODY" | grep -q '"error"' && { echo "FAILED: error in response"; exit 1; }
          echo "OK"

      - name: Check method -- v2
        run: |
          echo "Checking v2..."
          RESPONSE=$(curl -sf -w "\n%{http_code}" "https://freebird-api.com/status/$TWEET_ID/method/v2")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP $HTTP_CODE | $BODY"
          [ "$HTTP_CODE" = "200" ] || { echo "FAILED: got $HTTP_CODE"; exit 1; }
          echo "$BODY" | grep -q '"error"' && { echo "FAILED: error in response"; exit 1; }
          echo "OK"

      - name: Check method -- android
        run: |
          echo "Checking android..."
          RESPONSE=$(curl -sf -w "\n%{http_code}" "https://freebird-api.com/status/$TWEET_ID/method/android")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP $HTTP_CODE | $BODY"
          [ "$HTTP_CODE" = "200" ] || { echo "FAILED: got $HTTP_CODE"; exit 1; }
          echo "$BODY" | grep -q '"error"' && { echo "FAILED: error in response"; exit 1; }
          echo "OK"

      - name: Check method -- tweet-detail
        run: |
          echo "Checking tweet-detail..."
          RESPONSE=$(curl -sf -w "\n%{http_code}" "https://freebird-api.com/status/$TWEET_ID/method/tweet-detail")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP $HTTP_CODE | $BODY"
          [ "$HTTP_CODE" = "200" ] || { echo "FAILED: got $HTTP_CODE"; exit 1; }
          echo "$BODY" | grep -q '"error"' && { echo "FAILED: error in response"; exit 1; }
          echo "OK"

  check-simple:
    name: Check default (format simple)
    runs-on: ubuntu-latest
    needs: setup
    env:
      TWEET_ID: ${{ needs.setup.outputs.tweet_id }}
    steps:
      - name: Check default -- format simple
        run: |
          echo "Checking default with format=simple..."
          RESPONSE=$(curl -sf -w "\n%{http_code}" "https://freebird-api.com/status/$TWEET_ID/format/simple")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP $HTTP_CODE | $BODY"
          [ "$HTTP_CODE" = "200" ] || { echo "FAILED: got $HTTP_CODE"; exit 1; }
          echo "$BODY" | grep -q '"error"' && { echo "FAILED: error in response"; exit 1; }
          echo "OK"

  notify:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [check-methods, check-simple]
    if: failure()
    steps:
      - name: Send Telegram message
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d text="$(cat <<EOF
          <b>🚨 Freebird API health check failed</b>

          <b>Check-methods:</b> ${{ needs.check-methods.result }}
          <b>Check-simple:</b> ${{ needs.check-simple.result }}

          <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">View run logs</a>
          EOF
          )"
